name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify the release identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

      - name: Verify the trusted-publishing toolchain
        run: |
          node --version
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm 11.5.1 or newer is required for trusted publishing')" "${npm_version}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run the full test suite
        run: npm test

      - name: Pack the verified release
        run: npm pack --ignore-scripts

      - name: Preserve the verified package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package-${{ github.sha }}
          path: skinnycoder-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish with npm OIDC
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package-${{ github.sha }}
          path: package

      - name: Set up Node.js and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish to npm with OIDC
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm 11.5.1 or newer is required for trusted publishing')" "${npm_version}"
          mapfile -t packages < <(find package -maxdepth 1 -type f -name 'skinnycoder-*.tgz')
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one verified package tarball." >&2
            exit 1
          fi
          npm publish "${packages[0]}" --ignore-scripts --access public
